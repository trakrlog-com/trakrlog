<!doctype html>
<html lang="en" class="h-full dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo-web-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>TrakrLog - Open Source Event Logging for Indie Game & SaaS Developers</title>
    <meta name="title" content="TrakrLog - Open Source Event Logging for Indie Game & SaaS Developers">
    <meta name="description" content="Free, open source event logging platform designed specifically for indie game and SaaS developers. Self-host your analytics and own your data.">
    <meta name="keywords" content="open source analytics, event logging, indie game developers, indie SaaS, self-hosted analytics, game metrics, open source tools, indie dev tools, event tracking, game analytics, SaaS metrics">
    
    <!-- Robots and Indexing -->
    <meta name="robots" content="index, follow">
    <meta name="googlebot" content="index, follow">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://trakrlog.com/">
    <meta property="og:title" content="TrakrLog - Open Source Event Logging for Indie Game & SaaS Developers">
    <meta property="og:description" content="Free, open source event logging platform for indie developers. Self-host your analytics, own your data, and understand your users better.">
    <meta property="og:image" content="https://trakrlog.com/og-image.jpg">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://trakrlog.com/">
    <meta property="twitter:title" content="TrakrLog - Open Source Event Logging for Indie Game & SaaS Developers">
    <meta property="twitter:description" content="Free, open source event logging platform for indie developers. Self-host your analytics, own your data, and understand your users better.">
    <meta property="twitter:image" content="https://trakrlog.com/og-image.jpg">

    <!-- Additional SEO Tags -->
    <meta name="author" content="TrakrLog">
    <meta name="theme-color" content="#27282a">
    <meta name="application-name" content="TrakrLog">
    <link rel="canonical" href="https://trakrlog.com/">

    <!-- Performance and Compatibility -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="TrakrLog">
  </head>
  <body class="h-full">
    <div id="root"></div>
    <script type="module" src="/src/App.tsx"></script>
  </body>
</html>
