ES0WNYN8zmGAI0gukFxGrtohUCvVXG7ze5HtChqvAhU<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrakrLog - Push Notification Test</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
      background: #f5f5f5;
    }
    .container {
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h1 { color: #333; margin-top: 0; }
    button {
      background: #4CAF50;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      border-radius: 4px;
      cursor: pointer;
      margin: 5px;
    }
    button:hover { background: #45a049; }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    button.danger { background: #f44336; }
    button.danger:hover { background: #da190b; }
    #output {
      background: #f9f9f9;
      border: 1px solid #ddd;
      padding: 15px;
      margin-top: 20px;
      border-radius: 4px;
      white-space: pre-wrap;
      font-family: monospace;
      font-size: 12px;
      max-height: 400px;
      overflow-y: auto;
    }
    .status {
      padding: 10px;
      margin: 10px 0;
      border-radius: 4px;
    }
    .status.success { background: #d4edda; color: #155724; }
    .status.error { background: #f8d7da; color: #721c24; }
    .status.info { background: #d1ecf1; color: #0c5460; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔔 TrakrLog Push Notification Test</h1>
    
    <div id="status"></div>
    
    <div>
      <button id="subscribe">1. Subscribe to Notifications</button>
      <button id="list">2. List Subscriptions</button>
      <button id="test">3. Send Test Notification</button>
      <button id="createEvent">4. Create Event (triggers notification)</button>
      <button id="logs">5. View Notification Logs</button>
      <button id="unsubscribe" class="danger">Unsubscribe</button>
    </div>
    
    <pre id="output">Click a button to start...</pre>
  </div>

  <script>
    // IMPORTANT: Make sure you're logged in at http://localhost:4000 first!
    const VAPID_PUBLIC_KEY = 'BO2WN684M2ESAhj61Cs0egF2Bxv9R74EnHQsSzinUgf2hCulzzoIts-ckfF9yudzKbOHyuQTs_HmkvUBDKEs5m8';
    const API_BASE = 'http://localhost:4000/api';
    let subscriptionId = null;
    let currentSubscription = null;

    const output = document.getElementById('output');
    const statusDiv = document.getElementById('status');

    function log(message, data = null) {
      const timestamp = new Date().toLocaleTimeString();
      let text = `[${timestamp}] ${message}`;
      if (data) {
        text += '\n' + JSON.stringify(data, null, 2);
      }
      output.textContent = text + '\n\n' + output.textContent;
      console.log(message, data);
    }

    function showStatus(message, type = 'info') {
      statusDiv.innerHTML = `<div class="status ${type}">${message}</div>`;
    }

    function urlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
      const rawData = window.atob(base64);
      const outputArray = new Uint8Array(rawData.length);
      for (let i = 0; i < rawData.length; ++i) {
        outputArray[i] = rawData.charCodeAt(i);
      }
      return outputArray;
    }

    function arrayBufferToBase64(buffer) {
      if (!buffer) return '';
      // Convert ArrayBuffer to base64url (RFC 4648 Section 5)
      // This matches the Web Push protocol spec
      const bytes = new Uint8Array(buffer);
      const binString = String.fromCharCode(...bytes);
      const base64 = btoa(binString);
      // Convert to base64url: replace + with -, / with _, remove padding
      return base64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    // Subscribe
    document.getElementById('subscribe').addEventListener('click', async () => {
      try {
        log('Requesting notification permission...');
        
        // Request notification permission
        const permission = await Notification.requestPermission();
        if (permission !== 'granted') {
          throw new Error('Notification permission denied');
        }
        log('✓ Permission granted');

        // Register service worker
        log('Registering service worker...');
        const registration = await navigator.serviceWorker.register('/sw.js');
        await navigator.serviceWorker.ready;
        log('✓ Service worker registered');

        // Subscribe to push
        log('Subscribing to push notifications...');
        currentSubscription = await registration.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
        });
        log('✓ Push subscription created');

        // Get the keys properly
        const p256dhKey = currentSubscription.getKey('p256dh');
        const authKey = currentSubscription.getKey('auth');
        
        const p256dhBase64 = arrayBufferToBase64(p256dhKey);
        const authBase64 = arrayBufferToBase64(authKey);
        
        log('Keys encoded:', {
          p256dh_length: p256dhBase64.length,
          auth_length: authBase64.length,
          p256dh_sample: p256dhBase64.substring(0, 20) + '...',
          auth_sample: authBase64.substring(0, 20) + '...'
        });
        
        const subscriptionData = {
          endpoint: currentSubscription.endpoint,
          p256dh: p256dhBase64,
          auth: authBase64,
          userAgent: navigator.userAgent
        };

        // Send to backend
        log('Sending subscription to backend...');
        const response = await fetch(`${API_BASE}/notifications/subscriptions`, {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(subscriptionData)
        });

        const data = await response.json();
        if (!data.success) {
          throw new Error(data.message || 'Failed to create subscription');
        }

        subscriptionId = data.subscription.id;
        log('✓ SUBSCRIPTION SUCCESSFUL!', data);
        showStatus('✓ Successfully subscribed to notifications!', 'success');
      } catch (error) {
        log('✗ ERROR:', error.message);
        showStatus('✗ Error: ' + error.message, 'error');
      }
    });

    // 2. List subscriptions
    document.getElementById('list').addEventListener('click', async () => {
      try {
        const response = await fetch(`${API_BASE}/notifications/subscriptions`, {
          credentials: 'include'
        });
        const data = await response.json();
        log('Subscriptions:', data);
        
        // Store the first subscription ID if we don't have one
        if (data.subscriptions && data.subscriptions.length > 0 && !subscriptionId) {
          subscriptionId = data.subscriptions[0].id;
          log('✓ Stored subscription ID:', subscriptionId);
        }
        
        showStatus(`Found ${data.subscriptions?.length || 0} subscription(s)`, 'info');
      } catch (error) {
        log('✗ ERROR:', error.message);
        showStatus('✗ Error: ' + error.message, 'error');
      }
    });

    // 3. Send test notification
    document.getElementById('test').addEventListener('click', async () => {
      try {
        log('Sending test notification...');
        const response = await fetch(`${API_BASE}/notifications/test`, {
          method: 'POST',
          credentials: 'include'
        });
        const data = await response.json();
        log('Test notification response:', data);
        showStatus('Test notification sent! Check your browser.', 'success');
      } catch (error) {
        log('✗ ERROR:', error.message);
        showStatus('✗ Error: ' + error.message, 'error');
      }
    });

    // 4. Create event (should trigger notification)
    document.getElementById('createEvent').addEventListener('click', async () => {
      try {
        log('Creating test event...');
        const response = await fetch('http://localhost:4000/api/track', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-API-KEY': prompt('Enter your API key:')
          },
          body: JSON.stringify({
            project: 'test-project',
            channel: 'errors',
            title: 'Test Error from Notification Test Page',
            description: 'This event should trigger a push notification!',
            icon: '🔴',
            tags: {
              severity: 'high',
              test: 'true'
            }
          })
        });
        const data = await response.json();
        log('Event created:', data);
        showStatus('Event created! You should receive a notification.', 'success');
      } catch (error) {
        log('✗ ERROR:', error.message);
        showStatus('✗ Error: ' + error.message, 'error');
      }
    });

    // 5. View logs
    document.getElementById('logs').addEventListener('click', async () => {
      try {
        const response = await fetch(`${API_BASE}/notifications/logs?limit=10`, {
          credentials: 'include'
        });
        const data = await response.json();
        log('Notification logs:', data);
        showStatus(`Retrieved ${data.logs?.length || 0} log entries`, 'info');
      } catch (error) {
        log('✗ ERROR:', error.message);
        showStatus('✗ Error: ' + error.message, 'error');
      }
    });

    // Unsubscribe
    document.getElementById('unsubscribe').addEventListener('click', async () => {
      if (!subscriptionId) {
        alert('No active subscription');
        return;
      }
      try {
        log('Unsubscribing...');
        const response = await fetch(`${API_BASE}/notifications/subscriptions/${subscriptionId}`, {
          method: 'DELETE',
          credentials: 'include'
        });
        const data = await response.json();
        log('Unsubscribed:', data);
        subscriptionId = null;
        showStatus('Unsubscribed successfully', 'success');
      } catch (error) {
        log('✗ ERROR:', error.message);
        showStatus('✗ Error: ' + error.message, 'error');
      }
    });

    // Check initial state
    if ('serviceWorker' in navigator && 'PushManager' in window) {
      log('✓ Browser supports push notifications');
      showStatus('Browser supports push notifications. You can proceed with testing!', 'success');
    } else {
      log('✗ Browser does not support push notifications');
      showStatus('✗ Browser does not support push notifications', 'error');
    }
  </script>
</body>
</html>
